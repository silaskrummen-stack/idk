# nginx-Version nicht in Headern und Fehlerseiten verraten
server_tokens off;

server {
    listen 80;
    server_name silas-krummen.de www.silas-krummen.de civ.silas-krummen.de civ-admin.silas-krummen.de;

    # Allow Let's Encrypt renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Force HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}


server {
    listen 443 ssl;
    server_name silas-krummen.de www.silas-krummen.de;

    ssl_certificate /etc/letsencrypt/live/silas-krummen.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/silas-krummen.de/privkey.pem;

    root /var/www/html/public;

    # Sicherheits-Header. Gelten nur, solange keine location eigene add_header setzt.
    # 'unsafe-inline' wird noch für die Inline-Skripte und style-Attribute in den Templates gebraucht.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }
}


# ---------------------------------------------------------------------------
# CIV-Abend: eigener Container "civ", geschützt über den Portfolio-Login.
# Jeder Aufruf wird per auth_request bei Symfony (/portfolio/civ-auth/...) geprüft.
#   civ.silas-krummen.de        → Bildschirm   (Portfolio-Passwort)
#   civ-admin.silas-krummen.de  → Spielleitung (Benutzer civ_admin)
# Das Zertifikat muss beide Namen enthalten (siehe CIV-DEPLOY.md).
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name civ.silas-krummen.de;

    ssl_certificate /etc/letsencrypt/live/silas-krummen.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/silas-krummen.de/privkey.pem;

    # Container-Namen erst beim Aufruf auflösen: nginx startet auch, wenn "civ" gerade nicht läuft
    resolver 127.0.0.11 valid=30s;
    set $civ_upstream http://civ:80;

    location = /_civ_auth {
        internal;
        fastcgi_pass php:9000;
        fastcgi_pass_request_body off;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_METHOD GET;
        fastcgi_param REQUEST_URI /portfolio/civ-auth/display;
        fastcgi_param QUERY_STRING "";
        fastcgi_param CONTENT_LENGTH "";
        fastcgi_param SERVER_NAME $host;
        fastcgi_param SERVER_PORT 443;
        fastcgi_param HTTPS on;
        fastcgi_param REMOTE_ADDR $remote_addr;
    }

    location / {
        auth_request /_civ_auth;
        error_page 401 = @civ_login;

        proxy_pass $civ_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Abstimmung per QR-Code: die Handys der Mitspieler kommen ohne Login hierher.
    # Die Seite kann nur Stimmen für die gerade laufende Abstimmung abgeben, sonst nichts.
    location = /abstimmen {
        return 301 /abstimmen/;
    }

    location ^~ /abstimmen/ {
        proxy_pass $civ_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 4k;
    }

    # Watcher-Skript neben Civ VI (civ-mod/civ-bridge.ps1) meldet Spielereignisse – ohne Login,
    # geschützt über den Schlüssel aus dem Admin (Header X-Bridge-Token, prüft bridge.php selbst)
    location = /bridge.php {
        proxy_pass $civ_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 64k;
    }

    location @civ_login {
        return 302 https://silas-krummen.de/portfolio/civ/display;
    }
}

server {
    listen 443 ssl;
    server_name civ-admin.silas-krummen.de;

    ssl_certificate /etc/letsencrypt/live/silas-krummen.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/silas-krummen.de/privkey.pem;

    resolver 127.0.0.11 valid=30s;
    set $civ_upstream http://civ:80;

    location = /_civ_auth {
        internal;
        fastcgi_pass php:9000;
        fastcgi_pass_request_body off;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_METHOD GET;
        fastcgi_param REQUEST_URI /portfolio/civ-auth/admin;
        fastcgi_param QUERY_STRING "";
        fastcgi_param CONTENT_LENGTH "";
        fastcgi_param SERVER_NAME $host;
        fastcgi_param SERVER_PORT 443;
        fastcgi_param HTTPS on;
        fastcgi_param REMOTE_ADDR $remote_addr;
    }

    location / {
        auth_request /_civ_auth;
        error_page 401 = @civ_login;

        proxy_pass $civ_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 2m;
    }

    location @civ_login {
        return 302 https://silas-krummen.de/portfolio/civ/admin;
    }
}
