server {
    listen 80;
    server_name silas-krummen.de www.silas-krummen.de;

    # Allow Let's Encrypt renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Force HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}


server {
    listen 443 ssl;
    server_name silas-krummen.de www.silas-krummen.de;

    ssl_certificate /etc/letsencrypt/live/silas-krummen.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/silas-krummen.de/privkey.pem;

    root /var/www/html/public;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }
}